ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n    \n61. \u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n        \u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n        \u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7 ... ... ... ( ... \u0ba4\u0bbf\u0bb0\u0bc1 ... )\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n    \n62. \u0baa\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0bae\u0bc1\u0bb2\u0bc8 \u0b9a\u0bbf\u0bb1\u0bc1\u0ba4\u0bcd\u0ba4\u0b87\u0b9f\u0bc8 \u0bb5\u0bc6\u0bb3\u0bc1\u0ba4\u0bcd\u0ba4\u0ba8\u0b95\u0bc8\n        \u0b95\u0bb1\u0bc1\u0ba4\u0bcd\u0ba4\u0b95\u0bc1\u0bb4\u0bb2\u0bcd \u0b9a\u0bbf\u0bb5\u0ba4\u0bcd\u0ba4\u0b87\u0ba4\u0bb4\u0bcd \u0bae\u0bb1\u0b9a\u0bcd\u0b9a\u0bbf\u0bb1\u0bc1\u0bae\u0bbf\n        \u0bb5\u0bbf\u0bb4\u0bbf\u0b95\u0bcd\u0b95\u0bc1\u0ba8\u0bbf\u0b95\u0bb0\u0bcd \u0b86\u0b95\u0bc1\u0bae\u0bcd ... ... ... ( ... \u0ba4\u0bbf\u0bb0\u0bc1 ... )\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n    \n63. \u0ba4\u0bb0\u0bc1\u0b95\u0bcd\u0b95\u0bbf\u0ba8\u0bae\u0ba9\u0bcd \u0bae\u0bc1\u0bb0\u0bc1\u0b95\u0bcd\u0b95\u0bb5\u0bb0\u0bbf\u0ba9\u0bcd \u0b8e\u0bb0\u0bc1\u0b95\u0bcd\u0b95\u0bc1\u0bae\u0ba4\u0bbf\n         \u0ba4\u0bb0\u0bbf\u0ba4\u0bcd\u0ba4\u0bae\u0bc1\u0b9f\u0bbf \u0baa\u0b9f\u0bc8\u0ba4\u0bcd\u0ba4\u0bb5\u0bbf\u0bb1\u0bb2\u0bcd \u0baa\u0b9f\u0bc8\u0ba4\u0bcd\u0ba4\u0b87\u0bb1\u0bc8\n         \u0b95\u0bb4\u0bb1\u0bcd\u0b95\u0bc1\u0ba8\u0bbf\u0b95\u0bb0\u0bcd \u0b86\u0b95\u0bc1\u0bae\u0bcd ... ... ... ( ... \u0ba4\u0bbf\u0bb0\u0bc1 ... )\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n    \n64. \u0b9a\u0bca\u0bb2\u0bb1\u0bcd(\u0b95\u0bc1)\u0b85\u0bb0\u0bbf\u0baf \u0ba4\u0bbf\u0bb0\u0bc1\u0baa\u0bcd\u0baa\u0bc1\u0b95\u0bb4\u0bc8 \u0b89\u0bb0\u0bc8\u0ba4\u0bcd\u0ba4\u0bb5\u0bb0\u0bc8\n         \u0b85\u0b9f\u0bc1\u0ba4\u0bcd\u0ba4\u0baa\u0b95\u0bc8 \u0b85\u0bb1\u0bc1\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b8e\u0bb1\u0bbf\u0baf\n         \u0b89\u0bb1\u0bc1\u0b95\u0bcd\u0b95\u0bbf\u0b8e\u0bb4\u0bc1\u0bae\u0bcd \u0b85\u0bb1\u0ba4\u0bcd\u0ba4\u0bc8\u0ba8\u0bbf\u0bb2\u0bc8 \u0b95\u0bbe\u0ba3\u0bc1\u0bae\u0bcd ... ... ... ( ... \u0ba4\u0bbf\u0bb0\u0bc1 ... )\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n    \n65. \u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n        \u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n        \u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7 ... ... ... ( ... \u0ba4\u0bbf\u0bb0\u0bc1 ... )\n\n( ... \u0bae\u0bc1\u0b9f\u0bbf\u0bb5\u0bbf\u0bb2\u0bc1\u0bae\u0bcd \u0b87\u0ba8\u0bcd\u0ba4 \u0b85\u0b9f\u0bbf\u0baf\u0bc8 12 \u0bae\u0bc1\u0bb1\u0bc8 \u0b93\u0ba4\u0bb5\u0bc1\u0bae\u0bcd ... )\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n\n\u0ba4\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba3\u0bbf\u0baf\u0bbf\u0bb2\u0bcd \u0b89\u0ba4\u0bbf\u0ba4\u0bcd(\u0ba4\u0bc1)\u0b85\u0bb0\u0bc1\u0bb3\u0bc1\u0bae\u0bcd \u0b92\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0bb2\u0bc8\n\u0bb5\u0bbf\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0b8e\u0ba9(\u0ba4\u0bc1) \u0b89\u0bb3\u0ba4\u0bcd\u0ba4\u0bbf\u0bb2\u0bcd\u0b89\u0bb1\u0bc8\n\u0b95\u0bb0\u0bc1\u0ba4\u0bcd\u0ba4\u0ba9\u0bcd\u0bae\u0baf\u0bbf\u0bb2\u0bcd \u0ba8\u0b9f\u0ba4\u0bcd\u0ba4\u0bc1\u0b95\u0bc1\u0b95\u0ba9\u0bcd \u0bb5\u0bc7\u0bb2\u0bc7.\n                                            \n\n        \u0ba4\u0bc7\u0bb0\u0ba3\u0bbf \u0baf\u0bbf\u0b9f\u0bcd\u0b9f\u0bc1\u0baa\u0bcd \u0baa\u0bc1\u0bb0\u0bae\u0bcd \u0b8e\u0bb0\u0bbf\u0ba4\u0bcd \u0ba4\u0bbe\u0ba9\u0bcd\u0bae\u0b95\u0ba9\u0bcd \u0b9a\u0bc6\u0b99\u0bcd\u0b95\u0bc8\u0baf\u0bbf\u0bb2\u0bcd\u0bb5\u0bc7\u0bb1\u0bcd\n        \u0b95\u0bc2\u0bb0\u0ba3\u0bbf \u0baf\u0bbf\u0b9f\u0bcd\u0b9f\u0ba3\u0bc1 \u0bb5\u0bbe\u0b95\u0bbf\u0b95\u0bcd \u0b95\u0bbf\u0bb0\u0bcc\u0b9e\u0bcd\u0b9a\u0b99\u0bcd \u0b95\u0bc1\u0bb2\u0bc8\u0ba8\u0bcd\u0ba4\u0bb0\u0b95\u0bcd\u0b95\u0bb0\u0bcd\n        \u0ba8\u0bc7\u0bb0\u0ba3\u0bbf \u0baf\u0bbf\u0b9f\u0bcd\u0b9f\u0bc1 \u0bb5\u0bb3\u0bc8\u0ba8\u0bcd\u0ba4 \u0b95\u0b9f\u0b95\u0bae\u0bcd \u0ba8\u0bc6\u0bb3\u0bbf\u0ba8\u0bcd\u0ba4\u0bc1 \u0b9a\u0bc2\u0bb0\u0bcd\u0baa\u0bcd\n        \u0baa\u0bc7\u0bb0\u0ba3\u0bbf \u0b95\u0bc6\u0b9f\u0bcd\u0b9f\u0ba4\u0bc1 \u0ba4\u0bc7\u0bb5\u0bc7\u0ba8\u0bcd\u0ba4\u0bcd\u0bb0 \u0bb2\u0bcb\u0b95\u0bae\u0bcd \u0baa\u0bbf\u0bb4\u0bc8\u0ba4\u0bcd\u0ba4\u0ba4\u0bc1\u0bb5\u0bc7.\n\n        \u0bb5\u0bc0\u0bb0\u0bb5\u0bc7\u0bb2\u0bcd \u0ba4\u0bbe\u0bb0\u0bc8\u0bb5\u0bc7\u0bb2\u0bcd \u0bb5\u0bbf\u0ba3\u0bcd\u0ba3\u0bcb\u0bb0\u0bcd \u0b9a\u0bbf\u0bb1\u0bc8 \u0bae\u0bc0\u0b9f\u0bcd\u0b9f\n        \u0ba4\u0bc0\u0bb0\u0bb5\u0bc7\u0bb2\u0bcd \u0b9a\u0bc6\u0bb5\u0bcd\u0bb5\u0bc7\u0bb3\u0bcd \u0ba4\u0bbf\u0bb0\u0bc1\u0b95\u0bcd\u0b95\u0bc8\u0bb5\u0bc7\u0bb2\u0bcd - \u0bb5\u0bbe\u0bb0\u0bbf\n        \u0b95\u0bc1\u0bb3\u0bbf\u0ba4\u0bcd\u0ba4\u0bb5\u0bc7\u0bb2\u0bcd \u0b95\u0bca\u0bb1\u0bcd\u0bb1\u0bb5\u0bc7\u0bb2\u0bcd \u0b9a\u0bc2\u0bb0\u0bcd\u0bae\u0bbe\u0bb0\u0bcd\u0baa\u0bc1\u0bae\u0bcd \u0b95\u0bc1\u0ba9\u0bcd\u0bb1\u0bc1\u0bae\u0bcd\n        \u0ba4\u0bca\u0bb3\u0bc8\u0ba4\u0bcd\u0ba4\u0bb5\u0bc7\u0bb2\u0bcd \u0b89\u0ba3\u0bcd\u0b9f\u0bc7 \u0ba4\u0bc1\u0ba3\u0bc8.\n\n       ... ... ... \u0bb5\u0bc7\u0bb2\u0bc1\u0bae\u0bcd \u0bae\u0baf\u0bbf\u0bb2\u0bc1\u0bae\u0bcd \u0ba4\u0bc1\u0ba3\u0bc8 ... ... ...\n";
  const REFRAIN = 'திருத்தணியில் உதித்(து)அருளும் ஒருத்தன்மலை\nவிருத்தன்என(து) உளத்தில்உறை\nகருத்தன்மயில் நடத்துகுகன் வேலே.';

  function parseVerses(text) {
    const lines = text.split('\n');
    const pages = [];
    const numbered = /^(\d+)\.\s+([\s\S]*)/;
    const refrainLine = /திருத்தணியில் உதித்/;

    // Collect intro block: lines before verse 1
    let introLines = [];
    let verseStart = -1;
    for (let i = 0; i < lines.length; i++) {
      if (/^\s*1\.\s/.test(lines[i])) { verseStart = i; break; }
      // Skip the repeated refrain block at the top (lines 3-50ish)
      // Keep just the title line
      if (!refrainLine.test(lines[i])) {
        introLines.push(lines[i].trim());
      }
    }

    const introText = introLines
      .filter(l => l.length > 0)
      .join('\n');

    for (let r = 1; r <= 12; r++) {
      pages.push({ type: 'intro', count: r });
    }

    // Parse numbered verses
    let i = verseStart;
    while (i < lines.length) {
      const m = lines[i].match(/^\s*(\d+)\.\s+(.*)/);
      if (m) {
        const num = parseInt(m[1], 10);
        const bodyLines = [m[2].trim()];
        i++;
        // Collect continuation lines until next numbered verse or standalone refrain
        while (i < lines.length) {
          const line = lines[i];
          // Stop at next numbered verse
          if (/^\s*\d+\.\s/.test(line)) break;
          // Stop at standalone refrain (not indented with verse number)
          if (refrainLine.test(line) && !/^\s+\d/.test(line)) break;
          // Stop at closing instruction
          if (/முடிவிலும்/.test(line)) break;
          const trimmed = line.trim();
          if (trimmed.length > 0) bodyLines.push(trimmed);
          i++;
        }
        const body = bodyLines.join('\n').trim()
          .replace(/\s*\(\s*\.\.\.\s*திரு\s*\.\.\.\s*\)/g, '')
          .replace(/\s*\.\.\.\s*\.\.\.\s*\.\.\./g, '');
        pages.push({ type: 'verse', number: num, body });
      } else {
        i++;
      }
      if (i >= lines.length) break;
    }

    // Find epilogue after "முடிவிலும்"
    let epilogueStart = -1;
    for (let j = 0; j < lines.length; j++) {
      if (/தேரணி/.test(lines[j])) { epilogueStart = j; break; }
    }
    for (let r = 1; r <= 12; r++) {
      pages.push({ type: 'outro', count: r });
    }

    if (epilogueStart >= 0) {
      const epilogueLines = [];
      for (let j = epilogueStart; j < lines.length; j++) {
        const t = lines[j].trim();
        if (t) epilogueLines.push(t);
      }
      pages.push({
        type: 'special',
        title: 'முடிவு',
        body: epilogueLines.join('\n'),
      });
    }

    return pages;
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  let pages = [];
  let current = 0;

  const verseArea = document.getElementById('verseArea');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const loading = document.getElementById('loading');

  function renderPage(idx) {
    const page = pages[idx];
    let html = '';

    if (page.type === 'intro') {
      html = `
        <div class="verse-card">
          <div class="verse-number" style="margin-bottom:18px">தொடக்கம் — முறை ${page.count} / 12</div>
          <div class="refrain-body" style="font-size:clamp(1rem,3vw,1.35rem);color:var(--text)">${esc(REFRAIN)}</div>
          <div class="intro-dots">${Array.from({length:12},(_,i)=>`<span class="dot${i<page.count?' dot-done':''}">●</span>`).join('')}</div>
        </div>`;
    } else if (page.type === 'verse') {
      html = `
        <div class="verse-card">
          <div class="verse-number">பாடல் ${page.number} / 65</div>
          <div class="verse-body">${esc(page.body)}</div>
          <hr class="refrain-divider">
          <div class="refrain-body">${esc(REFRAIN)}</div>
        </div>`;
    } else if (page.type === 'outro') {
      html = `
        <div class="verse-card">
          <div class="verse-number" style="margin-bottom:18px">முடிவு — முறை ${page.count} / 12</div>
          <div class="refrain-body" style="font-size:clamp(1rem,3vw,1.35rem);color:var(--text)">${esc(REFRAIN)}</div>
          <div class="intro-dots">${Array.from({length:12},(_,i)=>`<span class="dot${i<page.count?' dot-done':''}">●</span>`).join('')}</div>
        </div>`;
    } else {
      html = `
        <div class="verse-card special-card">
          <div class="section-title">${esc(page.title)}</div>
          ${page.note ? `<div class="verse-number" style="margin-bottom:14px">${esc(page.note)}</div>` : ''}
          <div class="verse-body">${esc(page.body)}</div>
        </div>`;
    }

    verseArea.innerHTML = html;
    verseArea.scrollTop = 0;

    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === pages.length - 1;

    const pct = pages.length > 1 ? (idx / (pages.length - 1)) * 100 : 100;
    progress.style.width = pct + '%';

    const label = page.type === 'intro'
      ? `தொடக்கம் ${page.count}/12`
      : page.type === 'outro'
        ? `முடிவு ${page.count}/12`
        : page.type === 'verse'
          ? `${page.number} / 65`
          : 'முடிவு';
    counter.textContent = label;
  }

  function go(delta) {
    const next = current + delta;
    if (next >= 0 && next < pages.length) {
      current = next;
      renderPage(current);
    }
  }

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });

  let touchStartX = 0;
  document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  pages = parseVerses(VERSES_TEXT);
  loading.style.display = 'none';
  renderPage(0);
})();
</script>
</body>
</html>
